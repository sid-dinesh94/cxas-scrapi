evals:
  - name: Retry Confusion Test
    steps:
      - goal: |
          1. Provide a valid NPI '1234567890' when asked for National Provider ID.
          2. When the agent asks for Member ID, provide an invalid one (e.g., say 'invalid').
          3. When the agent asks for the Member ID again, provide a valid Member ID 'M12345678'.
          4. When asked for Date of Birth, provide a valid one '1990-01-01'.
        success_criteria: Agent successfully accepts the valid Member ID and proceeds to ask for Date of Birth, and eventually calls the verification tool.

  - name: Multi-Validation Failure Test
    steps:
      - goal: |
          1. Provide a valid NPI '1234567890'.
          2. Try to verify member details by providing Member ID 'M12345678' and DOB '1990-01-01' up to 3 times if the agent allows it.
          3. If the agent clears the fields or asks to try again, repeat the same inputs.
        success_criteria: Agent allows up to 3 failed verification attempts before escalating.
    expectations:
      - "Agent should call the tool `unified_member_verification` exactly 3 times before escalating."
      - "Agent should escalate or hang up after the 3rd failed verification attempt."

  - name: Multiple Policies - BH Transfer
    steps:
      - goal: Provide a valid NPI '1234567890'.
        success_criteria: Agent asks for Member ID.
      - goal: Provide Member ID '276Y20486'.
        success_criteria: Agent asks for Date of Birth.
      - goal: Provide DOB '1990-10-20'.
        success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
      - goal: Say 'Yes' to the Behavioral Health question.
        success_criteria: Agent transfers to live agent with subject 'precert' and category 'BH'.
    expectations:
      - "INSTRUCTION FOLLOWING: Agent must ask the user 'Is this for a Behavioral Health service?' after identifying multiple policies."
      - "TOOL CALL: Agent must call `set_nga_context_variable` with subject='precert' and category='BH' after user affirms."
      - "NEGATIVE ASSERTION: Agent should not ask the user if the service is for a transplant if they answer Yes to the Behavioral Health question."

  - name: Multiple Policies - Transplant Transfer
    steps:
      - goal: Provide a valid NPI '1234567890'.
        success_criteria: Agent asks for Member ID.
      - goal: Provide Member ID '276Y20486'.
        success_criteria: Agent asks for Date of Birth.
      - goal: Provide DOB '1990-10-20'.
        success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
      - goal: Say 'No' to the Behavioral Health question.
        success_criteria: Agent asks if the service is for a transplant.
      - goal: Say 'Yes' to the transplant question.
        success_criteria: Agent transfers to live agent with subject 'precert' and category 'Transplant'.
    expectations:
      - "INSTRUCTION FOLLOWING: Agent must ask the user if the service is for a transplant after user denies Behavioral Health."
      - "TOOL CALL: Agent must call `set_nga_context_variable` with subject='precert' and category='Transplant' after user affirms transplant."
      - "NEGATIVE ASSERTION: Agent should not ask if the user wants to transfer before asking about transplant."

  - name: Multiple Policies - No Transfer
    steps:
      - goal: Provide a valid NPI '1234567890'.
        success_criteria: Agent asks for Member ID.
      - goal: Provide Member ID '276Y20486'.
        success_criteria: Agent asks for Date of Birth.
      - goal: Provide DOB '1990-10-20'.
        success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
      - goal: Say 'No' to the Behavioral Health question.
        success_criteria: Agent asks if the service is for a transplant.
      - goal: Say 'No' to the transplant question.
        success_criteria: Agent asks to transfer or other questions.
      - goal: Say 'No' to transfer/other questions.
        success_criteria: Agent routes to wrap_menu_not_required_main.
    expectations:
      - "INSTRUCTION FOLLOWING: Agent must ask both about BH and Transplant."
      - "INSTRUCTION FOLLOWING: Agent must ask if user wants to transfer or has other questions after both negative answers."
      - "FLOW TRANSITION: Agent must route to wrap_menu_not_required_main after user answers No to transfer/other questions."

  - name: Multiple Policies - BH Unclear Fallback
    steps:
      - goal: Provide a valid NPI '1234567890'.
        success_criteria: Agent asks for Member ID.
      - goal: Provide Member ID '276Y20486'.
        success_criteria: Agent asks for Date of Birth.
      - goal: Provide DOB '1990-10-20'.
        success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
      - goal: Say something unclear to BH question (e.g., "I don't know").
        success_criteria: Agent asks if the service is for a transplant (Proceed to next step).
      - goal: Say something unclear to transplant question (e.g., "Maybe").
        success_criteria: Agent asks if user wants to transfer or has other questions (Proceed to next step).
    expectations:
      - "INSTRUCTION FOLLOWING: Agent must proceed to Transplant Check after unclear response to BH question."
      - "INSTRUCTION FOLLOWING: Agent must proceed to Transfer Check after unclear response to Transplant question."
